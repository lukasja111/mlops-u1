stages:
  prepare:
    cmd: python src/data_prep.py
    deps:
      - src/data_prep.py
      - data/raw
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - params.yaml:
    outs:
      - models/model.pkl
      - models/run_id.txt:
          cache: false
  evaluate:
    cmd: python src/eval.py
    deps:
      - src/eval.py
      - models/model.pkl
      - models/run_id.txt
      - data/processed/test.csv
    metrics:
      - metrics.json:
          cache: false

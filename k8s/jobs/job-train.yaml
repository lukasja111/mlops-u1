apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops-u1
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: train
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: train
          image: mlops-u1/train:dev
          imagePullPolicy: IfNotPresent
          args:
            - python
            - src/train.py
            - --n_trials=$(N_TRIALS)
            - --n_estimators=$(N_ESTIMATORS)
            - --max_depth=$(MAX_DEPTH)
            - --min_samples_leaf=$(MIN_SAMPLES_LEAF)
          envFrom:
            - configMapRef:
                name: training-config
            - secretRef:
                name: mlflow-trainer-credentials
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops-u1
resources:
  - deployment-api.yaml
  - service-api.yaml
images:
  - name: ghcr.io/lukasja111/mlops-u1/api
    newName: mlops-u1/api
    newTag: dev
configMapGenerator:
  - name: serving-config
    literals:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_URI=models:/airbnb-superhost@champion
      - MODEL_VERSION=2
      - IMAGE_TAG=dev

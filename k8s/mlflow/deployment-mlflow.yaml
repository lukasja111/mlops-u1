apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-u1
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.15.2-full
          command: ["mlflow"]
          args:
            - server
            - --backend-store-uri=postgresql://$(POSTGRES_USER)@postgres:5432/$(POSTGRES_DB)
            - --artifacts-destination=/mlartifacts
            - --host=0.0.0.0
            - --port=5000
            - --allowed-hosts=localhost:*,127.0.0.1:*,host.docker.internal:*,mlflow:5000,mlflow.mlops-u1.svc:5000
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 2560Mi}
            limits: {cpu: "1", memory: 3Gi}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
